<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natalia Luque · Tarjeta Personal</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --verde:  #0d2f2b;
    --coral:  #fa5152;
    --crema:  #FAF8F4;
    --blanco: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Raleway', sans-serif;
    background: #e7e5e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 40px 20px;
  }

  /* TARJETA — 55mm x 90mm vertical */
  .tarjeta {
    width: 55mm;
    height: 90mm;
    background: var(--verde);
    background-image:
      radial-gradient(ellipse 60mm 40mm at 100% 0%, rgba(250,81,82,0.10) 0%, transparent 60%),
      radial-gradient(ellipse 50mm 35mm at 0% 100%, rgba(255,255,255,0.04) 0%, transparent 60%);
    border-radius: 3mm;
    box-shadow: 0 12px 40px rgba(0,0,0,0.28);
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--crema);
    overflow: hidden;
    position: relative;
  }

  .barra { height: 2.2mm; background: var(--coral); width: 100%; flex-shrink: 0; }

  .contenido {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 5mm 4mm 4.5mm;
  }

  .marca { text-align: center; }
  .logo {
    font-weight: 900;
    font-size: 9mm;
    letter-spacing: 0.05em;
    line-height: 1;
    color: var(--blanco);
  }
  .logo-sub {
    margin-top: 1.6mm;
    font-size: 2.3mm;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--coral);
  }

  .divisor {
    width: 8mm;
    height: 0.4mm;
    background: var(--coral);
    border-radius: 1mm;
    margin: 3.2mm auto;
    opacity: 0.85;
  }

  .identidad { text-align: center; }
  .nombre {
    font-size: 4.4mm;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--blanco);
    margin-bottom: 1.6mm;
  }
  .rol {
    font-size: 2.3mm;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: rgba(255,255,255,0.72);
    line-height: 1.5;
  }
  .cpi {
    margin-top: 1.2mm;
    font-size: 2mm;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.4);
  }

  .qr-bloque { display: flex; flex-direction: column; align-items: center; }
  .qr-caja {
    width: 20mm;
    height: 20mm;
    background: var(--blanco);
    border-radius: 1.6mm;
    padding: 1.4mm;
    display: flex;
    box-shadow: 0 1.5mm 4mm rgba(0,0,0,0.18);
  }
  .qr-caja svg { width: 100%; height: 100%; display: block; }
  .qr-handle {
    margin-top: 1.8mm;
    font-size: 2.1mm;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: rgba(255,255,255,0.85);
  }

  .contacto {
    display: flex;
    align-items: center;
    gap: 1.6mm;
    font-size: 3mm;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--blanco);
  }
  .contacto svg { flex-shrink: 0; }

  /* ── controles fuera de la tarjeta (no se imprimen) ── */
  .ui { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ui p { font-size: 12px; color: #6b6b68; text-align: center; max-width: 300px; }
  .btn-imprimir {
    font-family: 'Raleway', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: #fff;
    background: var(--verde);
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
  }
  .btn-imprimir:hover { background: var(--coral); transform: translateY(-1px); }

  @media print {
    body { background: none; padding: 0; gap: 0; min-height: auto; display: block; }
    .ui { display: none; }
    .tarjeta { box-shadow: none; border-radius: 0; margin: 0; }
    @page { size: 55mm 90mm; margin: 0; }
  }
</style>
</head>
